name = "LeanEconomics"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanEconomics"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "LeanEconomics"

[[lean_lib]]
name = "EnclCert"
roots = ["EnclCert.Check", "EnclCert.Outer"]
precompileModules = true

[[lean_exe]]
name = "enclcert"
root = "EnclCertMain"

[[lean_exe]]
name = "outercert"
root = "OuterCertMain"
